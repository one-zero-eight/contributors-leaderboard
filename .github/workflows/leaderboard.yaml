name: Generate leaderboard

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Test data generation
        run: node --test .github/scripts/generate_leaderboard.test.mjs

      - name: Generate Typst data
        env:
          # Optional: create org secret GH_PAT for organization-wide private repo access.
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: node .github/scripts/generate_leaderboard.mjs

      - name: Compile leaderboards
        run: |
          typst compile typst/leaderboard.typ leaderboard.svg \
            --input view=overview \
            --font-path typst/assets/fonts \
            --ignore-system-fonts
          typst compile typst/leaderboard.typ leaderboard-overall.svg \
            --input view=overall \
            --font-path typst/assets/fonts \
            --ignore-system-fonts
          typst compile typst/leaderboard.typ leaderboard-monorepo.svg \
            --input view=monorepo \
            --font-path typst/assets/fonts \
            --ignore-system-fonts
          typst compile typst/leaderboard.typ leaderboard-website.svg \
            --input view=website \
            --font-path typst/assets/fonts \
            --ignore-system-fonts

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            typst/generated-data.typ \
            leaderboard.svg \
            leaderboard-overall.svg \
            leaderboard-monorepo.svg \
            leaderboard-website.svg

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "chore: update leaderboard"
          git push
