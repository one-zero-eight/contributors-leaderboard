name: Generate leaderboard

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: generate-leaderboard
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  leaderboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require GH_PAT for profile publishing
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "$GH_PAT" ]; then
            echo "GH_PAT secret is required to publish the organization profile README"
            exit 1
          fi

      - name: Checkout organization profile
        uses: actions/checkout@v4
        with:
          repository: one-zero-eight/.github
          ref: main
          path: profile-repo
          token: ${{ secrets.GH_PAT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Test data generation
        run: |
          node --test \
            .github/scripts/generate_leaderboard.test.mjs \
            .github/scripts/theme_svg.test.mjs \
            .github/scripts/update_profile_readme.test.mjs

      - name: Generate Typst data and Markdown
        env:
          # Required: org secret GH_PAT for private repos and profile publishing.
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: node .github/scripts/generate_leaderboard.mjs

      - name: Compile leaderboards
        run: |
          typst compile typst/leaderboard.typ leaderboard.svg \
            --input view=overview \
            --font-path typst/assets/fonts \
            --ignore-system-fonts
          typst compile typst/leaderboard.typ leaderboard-overall.svg \
            --input view=overall \
            --font-path typst/assets/fonts \
            --ignore-system-fonts
          typst compile typst/leaderboard.typ leaderboard-overall-summary.svg \
            --input view=summary \
            --font-path typst/assets/fonts \
            --ignore-system-fonts
          typst compile typst/leaderboard.typ leaderboard-overall-month.svg \
            --input view=overall_month \
            --font-path typst/assets/fonts \
            --ignore-system-fonts
          typst compile typst/leaderboard.typ leaderboard-monorepo.svg \
            --input view=monorepo \
            --font-path typst/assets/fonts \
            --ignore-system-fonts
          typst compile typst/leaderboard.typ leaderboard-website.svg \
            --input view=website \
            --font-path typst/assets/fonts \
            --ignore-system-fonts

      - name: Apply adaptive SVG theme
        run: |
          node .github/scripts/theme_svg.mjs \
            leaderboard.svg \
            leaderboard-overall.svg \
            leaderboard-overall-summary.svg \
            leaderboard-overall-month.svg \
            leaderboard-monorepo.svg \
            leaderboard-website.svg

      - name: Update organization profile README
        run: |
          node .github/scripts/update_profile_readme.mjs \
            profile-repo/profile/README.md \
            leaderboard-overall-month.md

      - name: Commit and push leaderboard artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            typst/generated-data.typ \
            leaderboard.svg \
            leaderboard-overall.svg \
            leaderboard-overall-summary.svg \
            leaderboard-overall-month.svg \
            leaderboard-overall-month.md \
            leaderboard-monorepo.svg \
            leaderboard-website.svg

          if git diff --cached --quiet; then
            echo "No leaderboard repository changes"
          else
            git commit -m "chore: update leaderboard"
            git push
          fi

      - name: Commit and push profile README
        working-directory: profile-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/README.md

          if git diff --cached --quiet; then
            echo "No profile README changes"
            exit 0
          fi

          git commit -m "chore: update monthly contributors leaderboard"
          git push
